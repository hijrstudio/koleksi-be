; Web (FrankenPHP), queue worker & scheduler dalam satu container. Nonaktifkan worker/scheduler lewat env
; RUN_QUEUE=false / RUN_SCHEDULER=false kalau nanti dipisah ke container lain.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile
directory=/app
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/app
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
startretries=10
stopsignal=TERM
; Beri waktu job yang sedang jalan untuk selesai
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php artisan schedule:work
directory=/app
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
