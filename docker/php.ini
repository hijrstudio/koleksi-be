; Upload dokumen kendaraan (maks. 10 MB) + foto profil (maks. 2 MB) dalam satu request
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Kode tidak berubah selama container hidup (deploy = image baru)
opcache.validate_timestamps = 0
