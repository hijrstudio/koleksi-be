# Build image backend -> ghcr.io/hijrstudio/koleksi-be (:latest & :<sha>), lalu deploy ke VPS.
# Image dibangun di sini, bukan di VPS: VPS OpenVZ membatasi thread, build di sana bisa melumpuhkan server.
#
# Deploy (job kedua) hanya jalan kalau repository variable VPS_DEPLOY = "true".
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (opsional, default 22; VPS NAT Jagoan: 50012)
name: Build & Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/koleksi-be:latest
            ghcr.io/${{ github.repository_owner }}/koleksi-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: bash ~/koleksi/be/deploy/deploy.sh
