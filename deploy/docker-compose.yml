# Stack produksi VPS: app (Laravel: web + queue + scheduler) & fe (Next.js). Hanya 2 container.
# Struktur di server:  ~/koleksi/be (repo koleksi-be)  &  ~/koleksi/fe (repo koleksi-fe)
# Jalankan dari folder ini lewat ./deploy.sh. Variabel ${...} diambil dari deploy/.env.
#
# Dirancang untuk VPS OpenVZ dengan batas thread per VPS yang ketat (VPS Hosting Jagoan + Webuzo):
#   - network_mode host: tanpa docker-proxy & NAT bridge; app/fe hanya listen di 127.0.0.1
#   - database = MariaDB bawaan Webuzo di host (bukan container), cache/queue/session = database (tanpa Redis)
#   - jumlah thread FrankenPHP/Node dibatasi, dan pids_limit per container
# HTTPS: Apache Webuzo reverse proxy ke 127.0.0.1:FE_PORT & APP_PORT -> lihat deploy/webuzo/
#
# Image dibangun GitHub Actions (ghcr.io); build di VPS berisiko menghabiskan batas thread.
# Build lokal tetap bisa: docker compose build

name: koleksi

services:
  app:
    image: ghcr.io/hijrstudio/koleksi-be:${IMAGE_TAG:-latest}
    build:
      context: ..
    network_mode: host
    env_file: ../.env
    environment:
      APP_URL: https://${API_DOMAIN}
      FRONTEND_URL: https://${FE_DOMAIN}
      FRONTEND_API_TOKEN: ${BACKEND_API_TOKEN}
      APP_BIND: 127.0.0.1
      APP_PORT: ${APP_PORT:-8080}
      PHP_THREADS: ${PHP_THREADS:-4}
      # Migrasi + RoleSeeder dijalankan docker/entrypoint.sh saat container start (lihat deploy.sh)
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: mariadb
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - storage:/app/storage
    pids_limit: ${APP_PIDS_LIMIT:-96}
    restart: unless-stopped

  fe:
    image: ghcr.io/hijrstudio/koleksi-fe:${IMAGE_TAG:-latest}
    build:
      context: ../../fe
      args:
        BACKEND_API_URL: https://${API_DOMAIN}/api/v1
        BACKEND_STORAGE_URL: ${BACKEND_STORAGE_URL:-}
        IMAGES_ALLOW_LOCAL_IP: "true"   # API_DOMAIN -> 127.0.0.1 (extra_hosts), lihat fe/next.config.ts
      secrets:
        - backend_api_token
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${FE_PORT:-3000}
      BACKEND_API_URL: https://${API_DOMAIN}/api/v1
      BACKEND_STORAGE_URL: ${BACKEND_STORAGE_URL:-}
      BACKEND_API_TOKEN: ${BACKEND_API_TOKEN}
      # Hemat thread: thread pool libuv & V8 diperkecil
      UV_THREADPOOL_SIZE: 2
      NODE_OPTIONS: --v8-pool-size=2
    # fe memanggil https://API_DOMAIN lewat web server di host ini, bukan lewat internet
    # (NAT VPS belum tentu mendukung koneksi balik ke IP publiknya sendiri)
    extra_hosts:
      - "${API_DOMAIN}:127.0.0.1"
    pids_limit: ${FE_PIDS_LIMIT:-64}
    depends_on:
      - app
    restart: unless-stopped

secrets:
  backend_api_token:
    environment: BACKEND_API_TOKEN

volumes:
  storage:
