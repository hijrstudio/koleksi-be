# Reverse proxy koleksi.club (+ www) -> container fe.
# Pasang di: /var/webuzo-data/apache2/custom/domains/koleksi.club.conf
# Webuzo meng-include file ini di VirtualHost HTTP & HTTPS domain tersebut.

ProxyPreserveHost On
ProxyRequests Off
# Apache sendiri yang menjawab "Expect: 100-continue" (upload besar lewat Server Action), tidak menunggu backend
Proxy100Continue Off
RequestHeader set X-Forwarded-Proto "https"

RewriteEngine On
# Validasi Let's Encrypt (SSL Webuzo) tetap dilayani Apache dari document root
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} ^www\. [NC]
RewriteRule ^ https://koleksi.club%{REQUEST_URI} [R=301,L]

ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:3000/ timeout=120
ProxyPassReverse / http://127.0.0.1:3000/

Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
