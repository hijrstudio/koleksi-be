# Reverse proxy cms.koleksi.club -> container app (Laravel), KHUSUS CMS admin.
# API dilayani di api.koleksi.club -> lihat api.koleksi.club.conf.
# Pasang di: /var/webuzo-data/apache2/custom/domains/cms.koleksi.club.conf
# Webuzo meng-include file ini di VirtualHost HTTP & HTTPS domain tersebut.

ProxyPreserveHost On
ProxyRequests Off
# Apache sendiri yang menjawab "Expect: 100-continue" (upload gambar/galeri), tidak menunggu backend
Proxy100Continue Off
RequestHeader set X-Forwarded-Proto "https"

RewriteEngine On
# Validasi Let's Encrypt (SSL Webuzo) tetap dilayani Apache dari document root
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://cms.koleksi.club%{REQUEST_URI} [R=301,L]

# API hanya di api.koleksi.club (CMS tidak memakainya)
RewriteRule ^/api(/|$) - [R=404,L]

ProxyPass /.well-known !
# Halaman error global Webuzo (Alias /error/, ErrorDocument 404/50x) dilayani Apache sendiri
ProxyPass /error/ !
ProxyPass / http://127.0.0.1:8080/ timeout=120
ProxyPassReverse / http://127.0.0.1:8080/

Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "same-origin"
Header always set X-Robots-Tag "noindex, nofollow"
