# Reverse proxy api.koleksi.club -> container app (Laravel), KHUSUS API & file publik.
# CMS (aplikasi Laravel yang sama) dilayani di cms.koleksi.club -> lihat cms.koleksi.club.conf.
# Pasang di: /var/webuzo-data/apache2/custom/domains/api.koleksi.club.conf
# Webuzo meng-include file ini di VirtualHost HTTP & HTTPS domain tersebut.

ProxyPreserveHost On
ProxyRequests Off
# Apache sendiri yang menjawab "Expect: 100-continue" (upload besar), tidak menunggu backend
Proxy100Continue Off
RequestHeader set X-Forwarded-Proto "https"

RewriteEngine On
# Validasi Let's Encrypt (SSL Webuzo) tetap dilayani Apache dari document root
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://api.koleksi.club%{REQUEST_URI} [R=301,L]

# Login CMS lewat API tidak dipakai siapa pun: tutup supaya tidak jadi jalur kedua menebak password admin
RewriteRule ^/api/auth(/|$) - [R=404,L]

# Selain API, file publik & health check -> CMS. Link "Review Pendaftaran" di e-mail admin
# dibuat dari APP_URL (api.), jadi ikut diarahkan ke cms. di sini.
RewriteCond %{REQUEST_URI} !^/(api/|storage/|up$|\.well-known/|error/)
RewriteRule ^ https://cms.koleksi.club%{REQUEST_URI} [R=302,L]

ProxyPass /.well-known !
# Halaman error global Webuzo (Alias /error/, ErrorDocument 404/50x) dilayani Apache sendiri
ProxyPass /error/ !
ProxyPass / http://127.0.0.1:8080/ timeout=120
ProxyPassReverse / http://127.0.0.1:8080/

Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Robots-Tag "noindex, nofollow"
