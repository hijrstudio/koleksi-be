# KHUSUS TES DI LAPTOP (Docker Desktop): image produksi yang sama, dibuka lewat localhost tanpa domain/Apache.
#   website  http://localhost:3000      CMS  http://localhost:8080      API  http://localhost:8080/api/v1
# Tidak dipakai di VPS. Cara pakai: lihat bagian "Tes di laptop" di README.md.

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # Docker Desktop: network host tidak terjangkau dari Windows, jadi pakai jaringan compose + port publish
    network_mode: !reset null
    ports:
      - "8080:8080"
      # port fe ikut di sini karena fe berbagi jaringan dengan app (lihat di bawah)
      - "3000:3000"
    environment:
      APP_BIND: 0.0.0.0
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  fe:
    # Berbagi jaringan dengan app: "localhost:8080" di dalam fe = app, sama seperti di browser,
    # jadi URL gambar http://localhost:8080/storage/... bisa dioptimasi next/image
    network_mode: service:app
    extra_hosts: !reset []
    build:
      # Prerender saat build memanggil API lewat port yang dipublish app (http://localhost:8080)
      network: host
      args:
        BACKEND_API_URL: http://localhost:8080/api/v1
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://localhost:8080/api/v1

volumes:
  db:
